spring.config.import=optional:file:./application-local.properties
# SQL Server Connection Settings
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=echanneling_system;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${CARELINK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update

# Extra useful configs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

# Mail Configuration (Dummy Mailtrap for testing)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=demo
spring.mail.password=demo
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Increase request size for Base64 images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=10MB

# Show full error details (for debugging)
server.error.include-message=always
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Session Timeout (15 minutes - as per system NFR requirement)
server.servlet.session.timeout=15m

# Seed demo data on startup (doctors, patients, appointments)
app.seed-demo=false

# Persistent notification outbox. Enable only after configuring the hospital SMTP account.
app.mail.enabled=${CARELINK_MAIL_ENABLED:false}
app.mail.from=${CARELINK_MAIL_FROM:}
app.notifications.scheduling-enabled=true
app.notifications.poll-ms=30000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
