<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>CareLink | Choose a new password</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="auth"><section class="auth-story"><h1>Choose a new password</h1><p>The reset link expires after 15 minutes and can be used once.</p></section>
<section class="auth-form"><div><form th:action="@{/reset-password}" method="post">
<input type="hidden" name="token" th:value="${token}">
<label class="field"><span>New password (at least 8 characters)</span><input type="password" name="newPassword" minlength="8" maxlength="72" required autocomplete="new-password"></label>
<button class="btn" type="submit">Save new password</button></form><a href="/login">Return to sign in</a></div></section></main></body></html>
