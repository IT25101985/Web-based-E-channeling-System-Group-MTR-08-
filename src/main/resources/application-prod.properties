# Production requires an existing migrated SQL Server schema and a least-privilege account.
spring.datasource.url=${CARELINK_DB_URL}
spring.datasource.username=${CARELINK_DB_USER}
spring.datasource.password=${CARELINK_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
app.legacy-repair.enabled=false
app.seed-demo=false
app.payments.demo-card-enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
spring.mail.host=${CARELINK_MAIL_HOST}
spring.mail.port=${CARELINK_MAIL_PORT:587}
spring.mail.username=${CARELINK_MAIL_USER}
spring.mail.password=${CARELINK_MAIL_PASSWORD}
app.mail.enabled=${CARELINK_MAIL_ENABLED:false}
app.mail.from=${CARELINK_MAIL_FROM:}
app.viva.datasource.url=${CARELINK_VIVA_DB_URL:jdbc:sqlserver://localhost;databaseName=IT2140_MTR08_Part02_20260927;encrypt=true;trustServerCertificate=false;loginTimeout=8}
app.viva.datasource.username=${CARELINK_VIVA_DB_USER:${CARELINK_DB_USER}}
app.viva.datasource.password=${CARELINK_VIVA_DB_PASSWORD:${CARELINK_DB_PASSWORD}}
app.recovery.base-url=${CARELINK_PUBLIC_URL}
